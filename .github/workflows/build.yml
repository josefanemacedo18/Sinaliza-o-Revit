name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testes do núcleo
        run: dotnet test tests/SinalizacaoViaria.Core.Tests -c Release
      - name: Compilar plugin
        run: dotnet build src/SinalizacaoViaria.Revit -c Release -p:DeployToRevit=false -o dist/SinalizacaoViaria
      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: SinalizacaoViaria-Revit2027
          path: |
            dist/SinalizacaoViaria/*.dll
            dist/SinalizacaoViaria/*.deps.json
            dist/SinalizacaoViaria/SinalizacaoViaria.addin
