name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Testes do núcleo
        run: dotnet test tests/SinalizacaoViaria.Core.Tests -c Release
      - name: Compilar plugin (DLL única)
        run: dotnet build src/SinalizacaoViaria.Revit -c Release -p:DeployToRevit=false
      - name: Publicar pacote
        uses: actions/upload-artifact@v4
        with:
          name: SinalizaBIM-Revit2027
          path: |
            Instalar/Revit2027/SinalizaBIM.dll
            Instalar/Revit2027/SinalizaBIM.addin
            Instalar/LEIA-ME.txt
